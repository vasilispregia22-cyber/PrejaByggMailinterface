<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrejaBygg Mail</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f1f3f6;color:#1f2937}
#loginPage{height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{width:380px;background:#fff;padding:38px;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.12)}
.logo{text-align:center;font-size:29px;font-weight:700}.subtitle{text-align:center;color:#6b7280;margin:8px 0 30px}
input,textarea{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:8px;margin-bottom:15px;font-size:15px;outline:none}
input:focus,textarea:focus{border-color:#111827}
button{border:0;padding:12px 18px;border-radius:8px;cursor:pointer;font-size:14px}
.login-btn,.send-btn{width:100%;background:#111827;color:#fff}
.login-btn:hover,.send-btn:hover{background:#000}
.error{color:#dc2626;text-align:center;margin-top:15px;display:none}
#mailPage{display:none;height:100vh}
.topbar{height:65px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 25px}
.brand{font-size:21px;font-weight:700}.user{display:flex;align-items:center;gap:15px}.logout{background:#374151;color:#fff}
.layout{display:flex;height:calc(100vh - 65px)}
.sidebar{width:220px;background:#fff;padding:20px;border-right:1px solid #ddd}
.compose{width:100%;background:#111827;color:#fff;margin-bottom:20px}
.menu{padding:12px;border-radius:7px;cursor:pointer;margin-bottom:5px}.menu:hover,.menu.active{background:#eef2f7}
.content{flex:1;padding:25px;overflow-y:auto}.panel{background:#fff;border-radius:12px;min-height:100%;overflow:hidden}
.panel-header{padding:20px;border-bottom:1px solid #eee;font-size:20px;font-weight:700}
.email{padding:18px 20px;border-bottom:1px solid #eee;cursor:pointer}.email:hover{background:#f8fafc}
.email-row{display:flex;justify-content:space-between}.sender{font-weight:700}.date{color:#6b7280;font-size:13px}
.subject{margin-top:5px}.preview{margin-top:5px;color:#6b7280;font-size:14px}
.email-view,.compose-window{padding:25px}.email-title{font-size:25px;margin:20px 0}
.email-info{color:#6b7280;margin-bottom:25px}.email-body{line-height:1.7;white-space:pre-wrap}
.back-btn,.cancel-btn{background:#e5e7eb}.reply-btn{background:#111827;color:#fff}
@media(max-width:700px){.sidebar{width:72px}.sidebar .menu{font-size:0}.compose{font-size:0}.content{padding:10px}.user span{display:none}}
</style>
</head>
<body>

<div id="loginPage">
  <div class="login-box">
    <div class="logo">PrejaBygg</div>
    <div class="subtitle">Private Mail</div>
    <input id="username" type="text" placeholder="Username" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button class="login-btn" onclick="login()">Logga in</button>
    <div id="loginError" class="error">Fel användarnamn eller lösenord.</div>
  </div>
</div>

<div id="mailPage">
  <div class="topbar">
    <div class="brand">PrejaBygg Mail</div>
    <div class="user">
      <span>info@prejabygg.se</span>
      <button class="logout" onclick="logout()">Logga ut</button>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <button class="compose" onclick="showCompose()">✉ Nytt mail</button>
      <div class="menu active" onclick="showInbox()">📥 Inkorg</div>
      <div class="menu">⭐ Stjärnmärkt</div>
      <div class="menu">🗑 Papperskorg</div>
    </aside>
    <main class="content">
      <div id="mainPanel" class="panel"></div>
    </main>
  </div>
</div>

<script>
/*
  PREJABYGG MAIL - TESTVERSION

  LOGIN:
  Username: byggmail
  Password: preja06

  VIKTIGT:
  Denna GitHub-version är frontend-only.
  Den kan visa ett webmail-interface men kan INTE ta emot
  riktiga email eller skicka riktiga email ännu.
  För riktiga email måste backend + IMAP/SMTP kopplas in.
*/

const LOGIN_USERNAME = "byggmail";
const LOGIN_PASSWORD = "preja06";

const demoEmails = [
  {
    id:1,
    sender:"kund@example.com",
    subject:"Förfrågan om offert",
    date:"2026-10-06 09:25",
    body:"Hej,\n\nJag skulle vilja få en offert för ett byggprojekt.\n\nKan ni återkomma med pris?\n\nMed vänliga hälsningar\nKund"
  },
  {
    id:2,
    sender:"leverantor@example.com",
    subject:"Leveransbekräftelse",
    date:"2026-10-05 15:42",
    body:"Hej,\n\nVi bekräftar leveransen enligt överenskommelse.\n\nMed vänliga hälsningar\nLeverantören"
  }
];

function login(){
  const u=document.getElementById("username").value;
  const p=document.getElementById("password").value;
  if(u===LOGIN_USERNAME && p===LOGIN_PASSWORD){
    document.getElementById("loginPage").style.display="none";
    document.getElementById("mailPage").style.display="block";
    document.getElementById("loginError").style.display="none";
    showInbox();
  }else{
    document.getElementById("loginError").style.display="block";
  }
}

function logout(){
  document.getElementById("mailPage").style.display="none";
  document.getElementById("loginPage").style.display="flex";
  document.getElementById("username").value="";
  document.getElementById("password").value="";
}

function showInbox(){
  let html='<div class="panel-header">📥 Inkorg</div>';
  demoEmails.forEach(e=>{
    html+=`
      <div class="email" onclick="openEmail(${e.id})">
        <div class="email-row">
          <div class="sender">${escapeHtml(e.sender)}</div>
          <div class="date">${escapeHtml(e.date)}</div>
        </div>
        <div class="subject">${escapeHtml(e.subject)}</div>
        <div class="preview">${escapeHtml(e.body.substring(0,90))}...</div>
      </div>`;
  });
  document.getElementById("mainPanel").innerHTML=html;
}

function openEmail(id){
  const e=demoEmails.find(x=>x.id===id);
  if(!e)return;
  document.getElementById("mainPanel").innerHTML=`
    <div class="email-view">
      <button class="back-btn" onclick="showInbox()">← Tillbaka</button>
      <div class="email-title">${escapeHtml(e.subject)}</div>
      <div class="email-info">
        <b>Från:</b> ${escapeHtml(e.sender)}<br>
        <b>Datum:</b> ${escapeHtml(e.date)}
      </div>
      <div class="email-body">${escapeHtml(e.body)}</div>
      <br>
      <button class="reply-btn" onclick="showCompose('${escapeAttr(e.sender)}')">↩ Svara</button>
    </div>`;
}

function showCompose(to=""){
  document.getElementById("mainPanel").innerHTML=`
    <div class="compose-window">
      <div class="panel-header">✉ Nytt mail</div><br>
      <input id="mailTo" type="email" placeholder="Till" value="${escapeAttr(to)}">
      <input id="mailSubject" type="text" placeholder="Ämne">
      <textarea id="mailMessage" rows="14" placeholder="Skriv ditt meddelande..."></textarea>
      <button class="send-btn" onclick="sendDemo()">📤 Skicka</button>
      <button class="cancel-btn" onclick="showInbox()">Avbryt</button>
    </div>`;
}

function sendDemo(){
  const to=document.getElementById("mailTo").value.trim();
  const subject=document.getElementById("mailSubject").value.trim();
  const message=document.getElementById("mailMessage").value.trim();
  if(!to||!subject||!message){
    alert("Fyll i Till, Ämne och Meddelande.");
    return;
  }
  alert("Demo-mail registrerat.\n\nTill: "+to+
        "\nFrån: info@prejabygg.se\n\nOBS: Denna version skickar ännu inte riktiga email.");
  showInbox();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function escapeAttr(s){return escapeHtml(s);}
</script>
</body>
</html>
